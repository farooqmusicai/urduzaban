name: Lughat - Platts se asli roman

# Sirf un NAYE lafzon ka roman theek karta hai jin me koi lambi awaz nahi
# (a aa o y e) — yahi wo hain jahan Tarjuman engine ko har harkat ka andaza
# lagana parta hai aur wo aksar ghalat baithta hai (harb -> harab, aqrab -> qarab).
#
# Sanad: Platts (1884) ka apna roman sirlafz. Purana roman phenka nahi jata —
# wo `alt` me chala jata hai taake talash dono taraf se chale.
# Jin lafzon ka Platts me saaf jawab na mile, unhe HAATH NAHI LAGTA.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roman:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Platts se roman nikalo aur jorho
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, unicodedata
          from urllib.parse import quote

          UA={'User-Agent':'urduzaban/1.0 (+https://www.urduzaban.com)'}
          def fetch(u, t=300):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t)

          MARKS=re.compile(r'[ً-ْٰٓ-ٟـۖ-ۭ]')
          TR={'ي':'ی','ى':'ی','ے':'ی','ۓ':'ی','ك':'ک','ه':'ہ','ة':'ہ','ۃ':'ہ',
              'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ؤ':'و','ۇ':'و','ئ':'ی','ء':''}
          def key(w):
              w=MARKS.sub('', w or '')
              w=''.join(TR.get(c,c) for c in w)
              return re.sub(r'[^؀-ۿ]','',w)

          AR2 = {'ب':'b','پ':'p','ت':'t','ٹ':'t','ث':'s','ج':'j','چ':'c','ح':'h',
                 'خ':'k','د':'d','ڈ':'d','ذ':'z','ر':'r','ڑ':'r','ز':'z','ژ':'z',
                 'س':'s','ش':'s','ص':'s','ض':'z','ط':'t','ظ':'z','ع':'','غ':'g',
                 'ف':'f','ق':'k','ک':'k','گ':'g','ل':'l','م':'m','ن':'n','ں':'n',
                 'و':'','ہ':'h','ی':'','ا':'','ھ':''}
          def sk_ar(w): return ''.join(AR2.get(c,'') for c in key(w))

          # Platts ka ilmi roman -> ghar ka imla
          GHAR = {'ā':'aa','ī':'ee','ū':'oo','ă':'a','ĭ':'i','ŭ':'u',
                  'ṭ':'t','ḍ':'d','ṇ':'n','ṛ':'r','ṙ':'r',
                  'ś':'sh','ṣ':'s','s̤':'s','ṡ':'s','z̤':'z','ẓ':'z','ẕ':'z','ż':'z',
                  'ḥ':'h','ẖ':'h','ḵ':'kh','ḳ':'q','ġ':'gh','ǵ':'gh',
                  'ñ':'n','ṉ':'n','ʼ':'','ʻ':'','‘':'','’':'',"'":'','-':'','.':''}
          # do-harfi jore pehle (Platts me خ = k + h wale nishan)
          JORE=[('\u1e35\u1e96','kh'),('\u01f5\u1e96','gh'),('\u1e35\u0331','kh'),
                ('s\u0324','s'),('z\u0324','z'),('t\u0324','t'),('d\u0324','d')]
          def pre(r):
              r=unicodedata.normalize('NFC', r or '')
              for a,b in JORE: r=r.replace(a,b)
              return r
          def ghar_imla(r):
              r=pre(r)
              out=[]
              for ch in r:
                  out.append(GHAR.get(ch, GHAR.get(ch.lower(), ch)))
              s=''.join(out).lower()
              s=re.sub(r'[^a-z]','',s)
              return s

          def sk_rm(r):
              DIA=str.maketrans({'ā':'a','ī':'i','ū':'u','ṭ':'t','ḍ':'d','ṇ':'n','ṛ':'r',
                                 'ś':'s','ṣ':'s','ġ':'g','ẖ':'h','ḥ':'h','ḳ':'k','ḵ':'k','ǵ':'g','ñ':'n','ṉ':'n','ṡ':'s',
                                 'ʼ':'','‘':'','’':'','ẓ':'z','ż':'z'})
              r=pre(r).lower().translate(DIA)
              r=re.sub(r'[^a-z]','',r)
              for a,b in (('kh','k'),('gh','g'),('sh','s'),('ch','c'),('th','t'),('dh','d'),
                          ('ph','p'),('bh','b'),('zh','z'),('jh','j'),('rh','r')):
                  r=r.replace(a,b)
              r=r.replace('q','k').replace('x','k').replace('w','').replace('v','').replace('y','')
              return re.sub(r'[aeiou]','',r)

          # ---------- 1) Platts parho: roman sirlafz + usi satar ka urdu ----------
          BY_URDU={}     # urdu key -> roman (Platts ka apna)
          BY_SK={}       # consonant dhancha -> set(roman)
          iid='platts-a-dictionary-of-urdu-classical-hindi-and-english-1884'
          lines=0
          meta=json.loads(fetch('https://archive.org/metadata/'+iid,60).read().decode('utf-8','replace'))
          txts=[f['name'] for f in meta.get('files',[]) if f.get('name','').endswith('_djvu.txt')]
          HEAD=re.compile(r"^[^A-Za-z]{0,6}([A-Za-zāīūăĭŭṭḍṇṛśṣṡḥẖḵḳġñz̤ẓẕż'ʼ‘’-]{2,25})\s*[,(]")
          URDU=re.compile(r'[؀-ۿ]{2,}')
          for tn in txts:
              body=fetch('https://archive.org/download/%s/%s'%(quote(iid),quote(tn))).read().decode('utf-8','replace')
              for L in body.split('\n'):
                  lines+=1
                  m=HEAD.match(L)
                  if not m: continue
                  rom=m.group(1)
                  s=sk_rm(rom)
                  if len(s)>=2:
                      BY_SK.setdefault(s,set()).add(rom)
                  for u in URDU.findall(L)[:1]:
                      k=key(u)
                      if len(k)>=2 and k not in BY_URDU:
                          BY_URDU[k]=rom

          # ---------- 2) lughat ----------
          j=json.load(open('uz-lughat.json',encoding='utf-8'))
          LONG=set('اآویےۓي')
          def bina_lambi(w):
              b=MARKS.sub('', w or '')
              return not any(c in LONG for c in b)

          hadaf=[e for e in j['entries'] if e.get('src')=='fa1' and bina_lambi(e.get('w',''))]

          badle=[]; seedha=0; dhanche_se=0; do_rai=[]; nahi_mila=[]
          for e in hadaf:
              w=e.get('w',''); k=key(w); s=sk_ar(k)
              rom=None; kaise=''
              if k in BY_URDU:
                  rom=BY_URDU[k]; kaise='urdu'; seedha+=1
              elif len(s)>=3 and s in BY_SK:
                  cands={ghar_imla(x) for x in BY_SK[s]}
                  cands={c for c in cands if c}
                  if len(cands)==1:
                      rom=list(BY_SK[s])[0]; kaise='dhancha'; dhanche_se+=1
                  else:
                      do_rai.append((w, e.get('r',''), ' · '.join(sorted(cands)[:6]), (e.get('en') or '')[:40]))
                      continue
              else:
                  nahi_mila.append((w, e.get('r',''), (e.get('en') or '')[:40]))
                  continue
              naya=ghar_imla(rom)
              purana=(e.get('r') or '').strip()
              if not naya or naya==purana: continue
              alt=[a for a in (e.get('alt') or []) if a]
              if purana and purana not in alt: alt.append(purana)
              e['alt']=alt
              e['r']=naya
              e.pop('re', None)          # ab yeh anjan ka andaza nahi, Platts ki sanad hai
              e['rsrc']='platts'
              badle.append((w, purana, naya, kaise, (e.get('en') or '')[:36]))

          j['updated']='2026-08-26'
          j['count']=len(j['entries'])
          j.setdefault('fields',{})['rsrc']='رومن کہاں سے آیا: platts = Platts (1884) کا اپنا سرلفظ (سند شدہ)'
          json.dump(j, open('uz-lughat.json','w',encoding='utf-8'), ensure_ascii=False, separators=(',',':'))

          R=[]
          R.append('# Platts سے اصل رومن — سند کے ساتھ\n')
          R.append('> صرف اُن نئے الفاظ پر کام ہوا جن میں کوئی لمبی آواز نہیں (وہی جہاں انجن کا اندازہ کچا تھا)۔\n')
          R.append('> پرانا رومن پھینکا نہیں گیا — وہ `alt` میں چلا گیا، تاکہ تلاش دونوں طرح چلے۔\n')
          R.append('| ناپ | تعداد |')
          R.append('|---|---|')
          R.append('| Platts کی پڑھی گئی سطریں | %d |'%lines)
          R.append('| Platts سے اردو ⇄ رومن جوڑے | %d |'%len(BY_URDU))
          R.append('| ہدف الفاظ (بغیر لمبی آواز) | %d |'%len(hadaf))
          R.append('| ✅ **رومن بدلا** | **%d** |'%len(badle))
          R.append('| &nbsp;&nbsp;↳ اردو لفظ سیدھا Platts میں ملا | %d |'%seedha)
          R.append('| &nbsp;&nbsp;↳ ڈھانچے سے ملا (ایک ہی امیدوار) | %d |'%dhanche_se)
          R.append('| ⏸ دو رائے (ایک سے زیادہ امیدوار) — ہاتھ نہیں لگایا | %d |'%len(do_rai))
          R.append('| ⏸ Platts میں نہیں ملا — ہاتھ نہیں لگایا | %d |'%len(nahi_mila))
          R.append('\n## بدلے ہوئے (پہلے 60)\n')
          R.append('| لفظ | پرانا (انجن) | نیا (Platts) | کیسے ملا | معنی |')
          R.append('|---|---|---|---|---|')
          for b in badle[:60]: R.append('| %s | `%s` | **`%s`** | %s | %s |'%b)
          if do_rai:
              R.append('\n## ⏸ دو رائے — فاروق صاحب کا فیصلہ چاہیے\n')
              R.append('| لفظ | انجن کا رومن | Platts کے امیدوار | معنی |')
              R.append('|---|---|---|---|')
              for d in do_rai[:60]: R.append('| %s | `%s` | %s | %s |'%d)
          if nahi_mila:
              R.append('\n## ⏸ Platts میں نہیں ملے\n')
              R.append('| لفظ | انجن کا رومن | معنی |')
              R.append('|---|---|---|')
              for n in nahi_mila[:60]: R.append('| %s | `%s` | %s |'%n)
          R.append('\n---\n*خودکار — 26 اگست 2026۔ صرف رومن کا خانہ چھوا گیا؛ معنی، اعراب اور باقی سب جوںے کۂ توں۔*\n')
          open('ROMAN-PLATTS.md','w',encoding='utf-8').write('\n'.join(R))
          print('\n'.join(R)[:2500])
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "lughat: Platts (1884) se asli roman - sirf bina-lambi-awaz naye lafz, purana roman alt me" || echo "no change"
          git push || echo "push skipped"
