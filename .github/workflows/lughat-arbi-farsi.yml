name: lughat-arbi-farsi

# Dour 5 — Adab ki chhalni (sakht) + rishta ka sakht usool + darban mazboot.
# Lughat me abhi bhi KUCH NAHI jata. Sirf tajweez files aur report banti hain.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Darban · chhalni · jaanch · tajweez
        run: |
          python3 - <<'PY'
          import json, re, os, urllib.request, unicodedata
          from urllib.parse import quote

          UA={'User-Agent':'urduzaban/1.0 (+https://www.urduzaban.com)'}
          def fetch(u, t=300):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t)

          MARKS=re.compile(r'[ً-ْٰٓ-ٟـۖ-ۭ]')
          HARK =re.compile(r'[ً-ْٰ]')
          TR={'ي':'ی','ى':'ی','ے':'ی','ۓ':'ی',
              'ك':'ک','ه':'ہ','ة':'ہ','ۃ':'ہ',
              'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا',
              'ؤ':'و','ۇ':'و','ئ':'ی','ء':''}
          def key(w):
              w=MARKS.sub('', w or '')
              w=''.join(TR.get(c,c) for c in w)
              return re.sub(r'[^؀-ۿ]','',w)

          # ---------- coarse phonetic skeleton (dono taraf ek jaisa) ----------
          AR2 = {'ب':'b','پ':'p','ت':'t','ٹ':'t','ث':'s','ج':'j',
                 'چ':'c','ح':'h','خ':'k','د':'d','ڈ':'d','ذ':'z',
                 'ر':'r','ڑ':'r','ز':'z','ژ':'z','س':'s','ش':'s',
                 'ص':'s','ض':'z','ط':'t','ظ':'z','ع':'','غ':'g',
                 'ف':'f','ق':'k','ک':'k','گ':'g','ل':'l','م':'m',
                 'ن':'n','ں':'n','و':'','ہ':'h','ی':'','ا':'',
                 'ھ':''}
          def sk_ar(w):
              w=key(w)
              return ''.join(AR2.get(c,'') for c in w)

          DIA=str.maketrans({'ā':'a','ī':'i','ū':'u','ṭ':'t','ḍ':'d',
                             'ṇ':'n','ṛ':'r','ś':'s','ṣ':'s','ġ':'g',
                             'ẖ':'h','ʼ':'','‘':'','’':'','̱':'','̣':''})
          def sk_rm(r):
              r=unicodedata.normalize('NFC',(r or '').lower()).translate(DIA)
              r=re.sub(r'[^a-z]','',r)
              for a,b in (('kh','k'),('gh','g'),('sh','s'),('ch','c'),('th','t'),('dh','d'),
                          ('ph','p'),('bh','b'),('zh','z'),('jh','j'),('rh','r')):
                  r=r.replace(a,b)
              r=r.replace('q','k').replace('x','k').replace('w','').replace('v','').replace('y','')
              return re.sub(r'[aeiou]','',r)

          # ================= DOUR 4 · ADAB KI CHHALNI =================
          # 1) fahsh chhalni — Wiktionary ke tags
          BAD_TAGS={'vulgar','obscene','slang','offensive','derogatory','ethnic-slur',
                    'ethnic slur','slur','profane','swear-word','swearword','taboo',
                    'pejorative','sexual','crude'}
          # 2) fahsh chhalni — angrezi maani (agar tag na laga ho)
          # (gadha = ass/donkey aur seena = breast jaise saaf lafz na pakde jayen)
          BAD_GLOSS=re.compile(r'\b(penis|vagina|vulva|testicl|scrotum|anus|arse|butthole|'
                               r'fuck|cunt|dick|cock\b|prick\b|whore|slut|prostitut|pimp\b|brothel|'
                               r'semen|sperm|ejacul|masturbat|orgasm|coitus|copulat|'
                               r'(sexual|carnal)\s+intercourse|'
                               r'fornicat|sodom|incest|rape\b|erotic|horny|lewd|obscene|porn|'
                               r'urinat|urine|piss\b|faeces|feces|shit\b|excrement|defecat|turd|'
                               r'bastard|cuckold|nipple|buttock|condom|'
                               r'clitoris|genital|foreskin|pubic|castrat|lust\b|lustful|seduc|'
                               r'aphrodisiac|virgin\b|menstru|nymph|libido|fondl|caress)', re.I)
          # 3) fahsh chhalni — nam ba nam (Farooq ki fehrist, §5.1)
          BAD_WORDS={key(x) for x in ('کیر','خایہ','کسکش','کس کش','شہوتی','شاش','کاپوت','گاند','چوت',
                     'لوڑا','پھدی','رنڈی','قحبہ','لواطت','مقعد','واژن')}
          # 4) jadeed chhalni — Europi zabanon se udhaar
          MODERN=re.compile(r'\b(French|English|Russian|German|Italian|Portuguese|Dutch|Spanish|'
                            r'Latin|Greek)\b', re.I)
          MODERN_WORDS={key(x) for x in ('مرسی','توییت','توئیت','رپ','لارو','تومان','صرب','ویکی',
                        'تلویزیون','رادیو','کامپیوتر','اینترنت','موبایل','تاکسی','بانک','هتل')}

          def sense_tags(j):
              t=set()
              for s in (j.get('senses') or []):
                  for x in (s.get('tags') or []): t.add(str(x).lower())
                  for x in (s.get('topics') or []): t.add(str(x).lower())
              for x in (j.get('tags') or []): t.add(str(x).lower())
              return t

          # saaf lafz jo galti se pakde ja sakte hain (rapeseed/canola = kalza)
          SAAF=re.compile(r'\b(rapeseed|canola|oilseed)\b', re.I)
          def fahsh(j, w, glosses):
              if sense_tags(j) & BAD_TAGS: return 'tag'
              if key(w) in BAD_WORDS: return 'naam'
              for g in glosses:
                  if BAD_GLOSS.search(g or '') and not SAAF.search(g or ''): return 'maani'
              return ''

          # ZWNJ (nim-fasla) sirf jadeed Irani imla me aata hai — Ghalib ki farsi me kabhi nahi
          ZWNJ='‌'
          def jadeed(j, w):
              if ZWNJ in (w or ''): return 'zwnj'
              if key(w) in MODERN_WORDS: return 'naam'
              et=(j.get('etymology_text') or '')
              if MODERN.search(et) and re.search(r'\b(borrow|loan|from)\b', et, re.I): return 'shajra'
              return ''
          # ===========================================================

          # ---------- 1) PLATTS = pehla darban ----------
          PL=set()
          iid='platts-a-dictionary-of-urdu-classical-hindi-and-english-1884'
          try:
              meta=json.loads(fetch('https://archive.org/metadata/'+iid,60).read().decode('utf-8','replace'))
              txts=[f['name'] for f in meta.get('files',[]) if f.get('name','').endswith('_djvu.txt')]
              plat_lines=0
              for tn in txts:
                  body=fetch('https://archive.org/download/%s/%s'%(quote(iid),quote(tn))).read().decode('utf-8','replace')
                  for L in body.split('\n'):
                      plat_lines+=1
                      m=re.match(r"^[^A-Za-z]{0,6}([A-Za-zāīūṭḍṇṛśṣġ'ʼ-]{2,25})\s*[,(]", L)
                      if m:
                          s=sk_rm(m.group(1))
                          if len(s)>=2: PL.add(s)
              plat_ok=True
          except Exception as e:
              plat_ok=False; plat_lines=0; print('platts fail', e)

          # ---------- 2) aap ki lughat ----------
          d=json.load(open('uz-lughat.json',encoding='utf-8')); E=d['entries']
          MINE={}
          for it in E:
              k=key(it.get('w') or '')
              if k: MINE.setdefault(k,it)
          MINE_KEYS=[k for k in MINE if len(k)>=3]

          STOP=set('a an the of to in and or for with is are be by on at as from that it its one'.split())
          def wen(s): return {t for t in re.findall(r"[a-z']+",(s or '').lower()) if len(t)>2 and t not in STOP}
          BADPOS={'name','character','punct','prefix','suffix','infix','interfix','circumfix','abbrev','phrase','proverb'}

          # ---------- 3) scan (arabi pehle: uska ARK darban banta hai) ----------
          ARK=set()      # arabi Wiktionary ke sab lafzon ka dhancha — doosra darban
          CUT={'fahsh_tag':0,'fahsh_naam':0,'fahsh_maani':0,
               'jadeed_naam':0,'jadeed_shajra':0,'jadeed_zwnj':0}
          CUT_SAMP=[]

          def scan(url, want_new, collect_ark):
              cands={}; new={}
              try: r=fetch(url)
              except Exception as e:
                  print('fail',url,e); return cands,new
              for raw in r:
                  try: j=json.loads(raw)
                  except Exception: continue
                  w=j.get('word') or ''; k=key(w)
                  if not k or len(k)<2: continue
                  pos=j.get('pos') or ''
                  gl=''; isform=False; allg=[]
                  for s in (j.get('senses') or []):
                      if s.get('form_of') or s.get('alt_of'): isform=True; continue
                      g=s.get('glosses') or []
                      if g:
                          allg.append(g[0])
                          if not gl: gl=g[0]
                  if collect_ark and gl and not isform and pos not in BADPOS:
                      s2=sk_ar(k)
                      if len(s2)>=2: ARK.add(s2)
                  voc = w if HARK.search(w) else ''
                  if not voc:
                      for f in (j.get('forms') or []):
                          fw=f.get('form') or ''
                          if HARK.search(fw) and key(fw)==k: voc=fw; break
                  if k in MINE:
                      cands.setdefault(k,[]).append({'voc':voc,'gl':gl,'pos':pos,'w':w})
                  elif want_new and gl and not isform and pos not in BADPOS and k not in new:
                      # ---- DOUR 4: chhalni yahan lagti hai ----
                      f_=fahsh(j,w,allg)
                      if f_:
                          CUT['fahsh_'+f_]+=1
                          if len(CUT_SAMP)<20: CUT_SAMP.append(('فحش/'+f_,pos,(gl or '')[:60]))
                          continue
                      m_=jadeed(j,w)
                      if m_:
                          CUT['jadeed_'+m_]+=1
                          if len(CUT_SAMP)<20: CUT_SAMP.append(('جدید/'+m_,pos,(gl or '')[:60]))
                          continue
                      new[k]={'w':MARKS.sub('',w),'voc':voc,'gl':gl,'pos':pos}
              return cands,new

          rep=['# دور ۵ — ادب کی سخت چھلنی + سخت رشتہ + مضبوط دربان\n',
               '> لغت میں **اب بھی کچھ نہیں ڈالا گیا**۔ یہ صرف چھنی ہوئی فہرست اور رپورٹ ہے۔\n']

          aeraab=[]; manzoor=[]; ghaur=[]; samp=[]
          for urn, url, want_new, ark in [('عربی','https://kaikki.org/dictionary/Arabic/kaikki.org-dictionary-Arabic.jsonl',False,True),
                                          ('فارسی','https://kaikki.org/dictionary/Persian/kaikki.org-dictionary-Persian.jsonl',True,False)]:
              cands,new=scan(url,want_new,ark)
              sabz=surkh=0
              for k,lst in cands.items():
                  it=MINE[k]; mine=wen(it.get('en'))
                  best=None; bestn=-1
                  for c in lst:
                      n=len(mine & wen(c['gl'])) if mine else 0
                      if c['voc']: n+=0.5
                      if n>bestn: bestn=n; best=c
                  ok = bool(mine and (mine & wen(best['gl'])))
                  if ok:
                      sabz+=1
                      if best['voc']:
                          aeraab.append((it.get('w',''),best['voc'],urn,(best['gl'] or '')[:80]))
                  else: surkh+=1
                  if len(samp)<45:
                      samp.append((urn,'🟢' if ok else '🔴',it.get('w',''),best['voc'] or '—',
                                   (it.get('en') or '')[:42],(best['gl'] or '')[:42],str(len(lst))))
              rep.append('\n**%s:** ملے %d · 🟢 تصدیق شدہ **%d** · 🔴 رد %d\n'%(urn,len(cands),sabz,surkh))

              # ---- DOUR 5: darban — teen raaste, magar rishta ab SAKHT ----
              # rishta sirf tab jab lafz do (ya ziyada) alag hisson ka jora ho
              # aur HAR hissa apne aap me maana rakhta ho: "bagh wahsh" ✅ · "zeest-shanasi" ❌
              def rishta(w):
                  parts=[p for p in re.split(r'[\s‌‍-]+', MARKS.sub('',w or '')) if p]
                  if len(parts)<2: return ''
                  hit=''
                  for p in parts:
                      pk=key(p)
                      if len(pk)<2: return ''
                      ps=sk_ar(pk)
                      if pk in MINE:
                          hit=hit or pk
                      elif len(ps)>=2 and (ps in PL or ps in ARK):
                          pass
                      else:
                          return ''
                  return ('rishta:'+hit) if hit else ''

              for k,v in new.items():
                  s=sk_ar(k)
                  row=(v['w'], v['voc'] or '', v['pos'], v['gl'][:110])
                  why=''
                  if len(s)>=2 and s in PL: why='platts'
                  elif len(s)>=2 and s in ARK: why='arbi'
                  else: why=rishta(v['w'])
                  if why: manzoor.append(row+(why,))
                  else: ghaur.append(row)

          # ---------- kasoti: purani (sirf Platts) aur nayi (poora darban) ----------
          hit_pl=hit_full=tot=0
          for k,it in MINE.items():
              s=sk_ar(k)
              if len(s)>=2:
                  tot+=1
                  in_pl = s in PL
                  if in_pl: hit_pl+=1
                  if in_pl or s in ARK: hit_full+=1
          kas_pl   = 100.0*hit_pl/tot if tot else 0.0
          kas_full = 100.0*hit_full/tot if tot else 0.0

          rep.append('\n## دربان کی کسوٹی — آپ کے اپنے الفاظ میں سے کتنے گزرتے ہیں\n')
          rep.append('| دربان | گزرے | کسوٹی |')
          rep.append('|---|---|---|')
          rep.append('| صرف Platts (دور ۳) | %d / %d | **%.1f%%** |'%(hit_pl,tot,kas_pl))
          rep.append('| Platts + عربی Wiktionary (دور ۴) | %d / %d | **%.1f%%** |'%(hit_full,tot,kas_full))
          rep.append('\n| چیز | تعداد |')
          rep.append('|---|---|')
          rep.append('| Platts سے نکالے گئے رومن سرلفظ | %d |'%len(PL))
          rep.append('| Platts کی پڑھی گئی سطریں | %d |'%plat_lines)
          rep.append('| عربی Wiktionary کے ڈھانچے (ARK) | %d |'%len(ARK))

          rep.append('\n## 🚨 چھلنی نے کیا نکالا\n')
          rep.append('| چھلنی | نکالے گئے |')
          rep.append('|---|---|')
          rep.append('| فحش — Wiktionary کا tag | %d |'%CUT['fahsh_tag'])
          rep.append('| فحش — انگریزی معنی سے پکڑا | %d |'%CUT['fahsh_maani'])
          rep.append('| فحش — نام بہ نام فہرست | %d |'%CUT['fahsh_naam'])
          rep.append('| جدید — یورپی شجرہ | %d |'%CUT['jadeed_shajra'])
          rep.append('| جدید — نیم‌فاصلہ (ZWNJ) والی ایرانی املا | %d |'%CUT['jadeed_zwnj'])
          rep.append('| جدید — نام بہ نام فہرست | %d |'%CUT['jadeed_naam'])
          rep.append('| **کل نکالے گئے** | **%d** |'%sum(CUT.values()))
          rep.append('\n> نکالے گئے الفاظ **کہیں محفوظ نہیں کیے گئے** — صرف گنتی رکھی ہے۔\n')

          rep.append('\n## دربان کا فیصلہ — نئے فارسی الفاظ (چھلنی کے بعد)\n')
          rep.append('| | تعداد |')
          rep.append('|---|---|')
          rep.append('| ✅ **دربان سے گزرے** | **%d** |'%len(manzoor))
          rep.append('| ⏸ زیرِ غور | %d |'%len(ghaur))
          bywhy={}
          for r_ in manzoor:
              t=r_[4].split(':')[0]; bywhy[t]=bywhy.get(t,0)+1
          for t,n in sorted(bywhy.items(), key=lambda x:-x[1]):
              rep.append('| &nbsp;&nbsp;↳ %s سے | %d |'%(t,n))
          rep.append('\n**تصدیق شدہ اعراب (عربی + فارسی):** **%d** الفاظ\n'%len(aeraab))

          rep.append('\n## نمونہ — دربان سے گزرے نئے فارسی الفاظ (پہلے 40)\n')
          rep.append('| لفظ | قسم | معنی | کیوں گزرا |')
          rep.append('|---|---|---|---|')
          for r_ in manzoor[:40]: rep.append('| %s | %s | %s | %s |'%(r_[0],r_[2],r_[3],r_[4]))

          rep.append('\n## نمونہ — ملے ہوئے الفاظ (اعراب)\n')
          rep.append('| زبان | درجہ | لفظ | اعراب | آپ کا معنی | چنا ہوا معنی | کتنے امیدوار |')
          rep.append('|---|---|---|---|---|---|---|')
          for s in samp: rep.append('| %s | %s | %s | %s | %s | %s | %s |'%s)

          rep.append('\n## نمونہ — جو رکے (زیرِ غور)\n')
          rep.append('| لفظ | قسم | معنی |')
          rep.append('|---|---|---|')
          for r_ in ghaur[:25]: rep.append('| %s | %s | %s |'%(r_[0],r_[2],r_[3]))

          os.makedirs('uz-data',exist_ok=True)
          def wr(p,head,rows):
              with open(p,'w',encoding='utf-8') as f:
                  f.write(head+'\n')
                  for t in rows: f.write('\t'.join(str(x).replace('\t',' ') for x in t)+'\n')
          wr('uz-data/tajweez-aeraab.tsv','lafz\taeraab\tzaban\tmaani_en',aeraab)
          wr('uz-data/tajweez-farsi-manzoor.tsv','lafz\taeraab\tqism\tmaani_en\tkyun',manzoor)
          wr('uz-data/tajweez-farsi-zer-e-ghaur.tsv','lafz\taeraab\tqism\tmaani_en',ghaur)

          rep.append('\n---\n*خودکار رپورٹ — لغت میں کچھ نہیں ملایا گیا۔*\n')
          open('ADAB-CHHALNI.md','w',encoding='utf-8').write('\n'.join(rep))
          print('\n'.join(rep)[:2500])
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "dour 5: sakht chhalni (ZWNJ + fahsh) + rishta ka sakht usool" || echo "no change"
          git push || echo "push skipped"
