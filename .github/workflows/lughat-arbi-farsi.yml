name: lughat-arbi-farsi

# Dour 2 — ginti theek, roman ki jaanch, aur TAJWEEZ files (lughat me kuch nahi jata).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Ginti · jaanch · tajweez
        run: |
          python3 - <<'PY'
          import json, re, os, urllib.request, collections

          UA={'User-Agent':'urduzaban/1.0 (+https://www.urduzaban.com)'}
          MARKS = re.compile(r'[ً-ْٰٓ-ٟۖ-ۭـ]')
          HARK  = re.compile(r'[ً-ْٰ]')
          TRANS = {'ي':'ی','ى':'ی','ے':'ی','ۓ':'ی',
                   'ك':'ک','ه':'ہ','ة':'ہ','ۃ':'ہ',
                   'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا',
                   'ؤ':'و','ۇ':'و','ئ':'ی','ء':''}
          def key(w):
              w = MARKS.sub('', w or '')
              w = ''.join(TRANS.get(c,c) for c in w)
              return re.sub(r'[^؀-ۿ]','',w)

          # ---------- arabi harakat -> vowel pattern (A=lambi, a=chhoti) ----------
          FAT,KAS,DAM,SUK,SHD,DAG,DIK,DUM,ALM = 'َ','ِ','ُ','ْ','ّ','ً','ٍ','ٌ','ٰ'
          def pat_ar(w):
              out=[]; i=0
              while i < len(w):
                  c=w[i]
                  if c in (FAT,KAS,DAM):
                      nxt = w[i+1] if i+1 < len(w) else ''
                      if c==FAT and nxt in ('ا',ALM): out.append('A'); i+=2; continue
                      if c==KAS and nxt=='ي': out.append('I'); i+=2; continue
                      if c==DAM and nxt=='و': out.append('U'); i+=2; continue
                      out.append({FAT:'a',KAS:'i',DAM:'u'}[c]); i+=1; continue
                  if c==ALM: out.append('A'); i+=1; continue
                  i+=1
              s=''.join(out)
              return s[:-1] if s and s[-1] in 'aiu' else s      # aakhri chhoti harkat girao

          VOW = re.compile(r"(aa|ā|ee|ii|ī|oo|uu|ū|ai|au|a|e|i|o|u)")
          LONG = {'aa':'A','ā':'A','ee':'I','ii':'I','ī':'I','oo':'U','uu':'U','ū':'U','ai':'A','au':'A'}
          def pat_rm(r):
              r=(r or '').lower()
              return ''.join(LONG.get(m,{'a':'a','e':'i','i':'i','o':'u','u':'u'}.get(m,'')) for m in VOW.findall(r))

          d=json.load(open('uz-lughat.json',encoding='utf-8')); E=d['entries']
          MINE={}
          for it in E:
              k=key(it.get('w') or '')
              if k: MINE.setdefault(k,it)

          STOP=set('a an the of to in and or for with is are be by on at as from that it its one'.split())
          def wen(s): return {t for t in re.findall(r"[a-z']+", (s or '').lower()) if len(t)>2 and t not in STOP}

          BADPOS={'name','character','punct','prefix','suffix','infix','interfix','circumfix','abbrev','phrase','proverb'}

          rep=['# عربی + فارسی — دور ۲ (جانچ)\n','> لغت میں اب بھی **ایک لفظ بھی نہیں ڈالا گیا**۔ یہ تجویزی فائلیں ہیں۔\n',
               '**آپ کی لغت:** %d اندراج · %d کنجیاں\n'%(len(E),len(MINE))]
          tbl=[]; samp=[]; tajweez_ar=[]; tajweez_fa=[]; nay_fa=[]

          for urn, lang, url in [('عربی','Arabic','https://kaikki.org/dictionary/Arabic/kaikki.org-dictionary-Arabic.jsonl'),
                                 ('فارسی','Persian','https://kaikki.org/dictionary/Persian/kaikki.org-dictionary-Persian.jsonl')]:
              matched={}; new={}
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=300)
              except Exception as e:
                  rep.append('\n> %s نہیں پہنچا: %s\n'%(urn,str(e)[:80])); continue
              for raw in r:
                  try: j=json.loads(raw)
                  except Exception: continue
                  w=j.get('word') or ''; k=key(w)
                  if not k or len(k)<2: continue
                  pos=(j.get('pos') or '')
                  gl=''; isform=False
                  for s in (j.get('senses') or []):
                      if s.get('form_of') or s.get('alt_of'): isform=True; continue
                      g=s.get('glosses') or []
                      if g and not gl: gl=g[0]
                  voc = w if HARK.search(w) else ''
                  if not voc:
                      for f in (j.get('forms') or []):
                          fw=f.get('form') or ''
                          if HARK.search(fw) and key(fw)==k: voc=fw; break
                  if k in MINE:
                      c=matched.get(k)
                      if c is None or (not c['voc'] and voc) or (not c['gl'] and gl):
                          matched[k]={'voc':voc,'gl':gl,'w':w,'pos':pos}
                  else:
                      if gl and not isform and pos not in BADPOS and k not in new:
                          new[k]={'w':MARKS.sub('',w),'voc':voc,'gl':gl,'pos':pos}

              sabz=zard=surkh=0; aeraab_naya=0; roman_judged=roman_ok=0
              for k,m in matched.items():
                  it=MINE[k]
                  en_ok=None
                  a,b=wen(it.get('en')),wen(m['gl'])
                  if a and b: en_ok = bool(a&b)
                  rm_ok=None
                  if m['voc'] and (it.get('r') or ''):
                      pa,pr=pat_ar(m['voc']),pat_rm(it.get('r'))
                      if pa and pr:
                          roman_judged+=1; rm_ok=(pa==pr)
                          if rm_ok: roman_ok+=1
                  votes=[v for v in (en_ok,rm_ok) if v is not None]
                  if votes and all(votes): tier='🟢'; sabz+=1
                  elif votes and any(votes): tier='🟡'; zard+=1
                  else: tier='🔴'; surkh+=1
                  if tier=='🟢' and m['voc']:
                      aeraab_naya+=1
                      tajweez_ar.append((it.get('w',''), m['voc'], urn, (m['gl'] or '')[:80]))
                  if len(samp)<60 and (en_ok is not None or rm_ok is not None):
                      samp.append((urn,tier,it.get('w',''),m['voc'] or '—',(it.get('r') or '—'),
                                   (it.get('en') or '')[:45],(m['gl'] or '')[:45]))
              tbl.append((urn,len(matched),sabz,zard,surkh,aeraab_naya,roman_judged,roman_ok,len(new)))
              if lang=='Persian':
                  for k,v in new.items():
                      nay_fa.append((v['w'], v['voc'] or '', v['pos'], v['gl'][:120]))

          rep.append('\n## گنتی — دور ۲\n')
          rep.append('| زبان | ملے | 🟢 محفوظ | 🟡 مشکوک | 🔴 رد | **اعراب تیار** | رومن جانچے | رومن ملے | نئے (چھنے ہوئے) |')
          rep.append('|---|---|---|---|---|---|---|---|---|')
          for t in tbl: rep.append('| %s | %d | **%d** | %d | %d | **%d** | %d | %d | %d |'%t)

          rep.append('\n## نمونہ\n')
          rep.append('| زبان | درجہ | لفظ | اعراب | آپ کا رومن | آپ کا معنی | اُن کا معنی |')
          rep.append('|---|---|---|---|---|---|---|')
          for s in samp[:60]: rep.append('| %s | %s | %s | %s | %s | %s | %s |'%s)

          os.makedirs('uz-data',exist_ok=True)
          with open('uz-data/tajweez-aeraab.tsv','w',encoding='utf-8') as f:
              f.write('lafz\taeraab\tzaban\tun_ka_maani\n')
              for t in tajweez_ar: f.write('\t'.join(str(x).replace('\t',' ') for x in t)+'\n')
          with open('uz-data/tajweez-farsi-naye.tsv','w',encoding='utf-8') as f:
              f.write('lafz\taeraab\tqism\tmaani_en\n')
              for t in nay_fa: f.write('\t'.join(str(x).replace('\t',' ') for x in t)+'\n')

          rep.append('\n## تیار فائلیں (لغت میں نہیں — صرف تجویز)\n')
          rep.append('- `uz-data/tajweez-aeraab.tsv` — **%d** الفاظ جن کا اعراب محفوظ ہے\n'%len(tajweez_ar))
          rep.append('- `uz-data/tajweez-farsi-naye.tsv` — **%d** نئے فارسی الفاظ، معنی سمیت (نام، جگہیں اور گردانیں نکال دی گئیں)\n'%len(nay_fa))
          rep.append('\n---\n*خودکار رپورٹ — فاروق نے کچھ download نہیں کیا۔ لغت میں کچھ نہیں ملایا گیا۔*\n')

          open('ARBI-FARSI-SURVEY.md','w',encoding='utf-8').write('\n'.join(rep))
          print('\n'.join(rep)[:2500])
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "arbi-farsi: dour 2 - jaanch aur tajweez files" || echo "no change"
          git push || echo "push skipped"
