name: lughat-platts

# Platts (1884) ka survey — SIRF ginti aur namoona. Lughat me kuch nahi milaya jata.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe + report
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, gzip, io, os

          UA = {'User-Agent':'urduzaban-survey/1.0 (+https://www.urduzaban.com)'}
          def get(url, timeout=120, maxb=None):
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      code = r.getcode()
                      data = r.read(maxb) if maxb else r.read()
                      if r.headers.get('Content-Encoding') == 'gzip':
                          data = gzip.decompress(data)
                      return code, data
              except Exception as e:
                  return 0, str(e).encode('utf-8', 'replace')

          os.makedirs('uz-data', exist_ok=True)
          with open('uz-data/platts-sample.txt','w',encoding='utf-8') as fh: fh.write('(khali)\n')

          rep = []
          rep.append("# Platts (1884) — سروے / SURVEY\n")
          rep.append("> یہ صرف **جانچ** ہے۔ لغت میں ایک لفظ بھی نہیں ڈالا گیا۔\n")

          doors = []

          # ---------- 1) Internet Archive ----------
          IDS = [
            'platts-a-dictionary-of-urdu-classical-hindi-and-english-1884',
            'dli.ernet.527546',
            'dli.ernet.528657',
            'ahandyurduengli00shakgoog',
          ]
          ia_rows = []
          best = None
          for iid in IDS:
              code, body = get('https://archive.org/metadata/' + iid, timeout=60)
              doors.append(('ia-meta:' + iid, code))
              if code != 200:
                  ia_rows.append((iid, 'HTTP %s' % code, '-', '-'))
                  continue
              try:
                  meta = json.loads(body.decode('utf-8', 'replace'))
              except Exception:
                  ia_rows.append((iid, 'bad json', '-', '-'))
                  continue
              files = meta.get('files', [])
              txts = [f for f in files if f.get('name','').endswith('_djvu.txt') or f.get('name','').endswith('.txt')]
              names = ' · '.join(sorted({f.get('format','?') for f in files}))[:120]
              tname = txts[0]['name'] if txts else '-'
              tsize = int(txts[0].get('size', 0)) if txts and txts[0].get('size') else 0
              ia_rows.append((iid, 'HTTP 200', tname, '%.1f MB' % (tsize/1048576.0) if tsize else '?'))
              if txts and (best is None or tsize > best[2]):
                  best = (iid, tname, tsize)

          rep.append("\n## ۱) Internet Archive (عوامی ملکیت — public domain)\n")
          rep.append("| item | جواب | متن کی فائل | حجم |")
          rep.append("|---|---|---|---|")
          for r in ia_rows:
              rep.append("| `%s` | %s | `%s` | %s |" % r)

          sample = ''
          nlines = 0
          urdu_lines = 0
          entries = 0
          ex = []
          if best:
              iid, tname, tsize = best
              url = 'https://archive.org/download/%s/%s' % (iid, tname)
              code, body = get(url, timeout=300)
              doors.append(('ia-text', code))
              if code == 200:
                  txt = body.decode('utf-8', 'replace')
                  lines = txt.split('\n')
                  nlines = len(lines)
                  URDU = re.compile(r'[؀-ۿ]')
                  urdu_lines = sum(1 for L in lines if URDU.search(L))
                  # Platts ki shakl: urdu sar-lafz + roman + angrezi
                  ENT = re.compile(r'^\s*([؀-ۿ][؀-ۿ‌\s]{0,30})\s+([a-zA-Zāīūṭḍṇṛśṣġẖ\'\-\.]{2,25})\s*[,\(]')
                  for L in lines:
                      m = ENT.match(L)
                      if m:
                          entries += 1
                          if len(ex) < 25:
                              ex.append(L.strip()[:160])
                  os.makedirs('uz-data', exist_ok=True)
                  with open('uz-data/platts-sample.txt', 'w', encoding='utf-8') as fh:
                      fh.write('\n'.join(lines[2000:2200]))
                  rep.append("\n**سب سے بڑی متن فائل:** `%s` — %.1f MB · %d سطریں · اُن میں اردو رسم الخط والی **%d** سطریں\n" % (tname, tsize/1048576.0, nlines, urdu_lines))
                  rep.append("**Platts کی شکل سے ملتی سطریں (ممکنہ اندراج):** %d\n" % entries)
                  if ex:
                      rep.append("### نمونہ (OCR جیسا آیا، ویسا ہی)\n")
                      rep.append("```")
                      rep.extend(ex)
                      rep.append("```")
                  rep.append("\n> 200 سطروں کا مکمل نمونہ `uz-data/platts-sample.txt` میں رکھا ہے — اپنی آنکھ سے معیار دیکھ لیں۔\n")
              else:
                  rep.append("\n> متن فائل نہیں اتری (HTTP %s)۔\n" % code)

          # ---------- 2) DSAL ----------
          rep.append("\n## ۲) DSAL (شکاگو یونیورسٹی) — تیار شدہ ڈیجیٹل متن\n")
          code, body = get('https://dsal.uchicago.edu/dictionaries/platts/', timeout=60)
          doors.append(('dsal-platts', code))
          lic = '-'
          if code == 200:
              h = body.decode('utf-8', 'replace')
              m = re.search(r'creativecommons\.org/licenses/([a-z\-]+)/([0-9\.]+)', h)
              if m:
                  lic = m.group(1).upper() + ' ' + m.group(2)
              rep.append("| چیز | حال |")
              rep.append("|---|---|")
              rep.append("| دروازہ | HTTP 200 |")
              rep.append("| اجازت نامہ (licence) | **%s** |" % lic)
              rep.append("| bulk download | صفحے پر کوئی نہیں ملا |")
              if 'nd' in lic.lower():
                  rep.append("\n> ⚠️ **ND = No Derivatives** اور **NC = Non-Commercial**۔ اس کا مطلب: DSAL کا تیار متن اٹھا کر اپنی لغت میں ملانا اجازت نامے کے خلاف ہوگا۔ **1884 کی کتاب خود عوامی ملکیت ہے** — پابندی صرف DSAL کی ٹائپ شدہ نقل پر ہے۔ صاف راستہ: یا تو Internet Archive کا اپنا OCR (اوپر)، یا DSAL کو خط لکھ کر تحریری اجازت۔\n")
          else:
              rep.append("\n> دروازہ بند (HTTP %s)۔\n" % code)

          # ---------- darwazon ki halat ----------
          rep.append("\n## دروازوں کی حالت\n")
          rep.append("| ماخذ | جواب |")
          rep.append("|---|---|")
          for n, c in doors:
              rep.append("| %s | %s |" % (n, 'HTTP %s' % c if c else 'نہیں پہنچا'))

          rep.append("\n---\n*یہ رپورٹ خودکار بنی — GitHub Actions خود گیا اور گِنا۔ فاروق نے کچھ download نہیں کیا۔ لغت میں کچھ نہیں ملایا گیا۔*\n")

          with open('PLATTS-SURVEY.md', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(rep))
          print('\n'.join(rep)[:4000])
          PY

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "platts: survey (sirf ginti aur namoona, kuch jora nahi)" || echo "no change"
          git push || echo "push skipped"
