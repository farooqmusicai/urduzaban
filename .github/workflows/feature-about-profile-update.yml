name: Feature About profile update

on:
  push:
    branches:
      - feature/about-profile-update-2026-09-06
    paths:
      - .github/workflows/feature-about-profile-update.yml

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/about-profile-update-2026-09-06

      - name: Update public About profile safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('about.html')
          s=p.read_text(encoding='utf-8')

          replacements = [
            (
              '<meta name="description" content="اردو زبان کے بانی محمد فاروق، قطر — ایک آزاد، مفت اور عوامی اردو پلیٹ فارم کا مقصد، سفر، منصوبے اور دعوتِ شراکت۔">',
              '<meta name="description" content="اردو زبان کے بانی محمد فاروق — قطر میں سرکاری IT شعبے سے وابستہ، AI-assisted products بنانے والے؛ UrduZaban، Farooq Music، FarooqStars، MyMandoob اور Farooq Drive کا تعارف۔">'
            ),
            (
              '<p class="sub"><span class="L-ur">اکاؤنٹنگ میں 25+ سال کا تجربہ، اب AI کے ساتھ اپنے آزاد digital products بنا رہے ہیں۔ ذاتی اصول: <strong>AI زندگی کو آسان بناتا ہے۔</strong></span><span class="L-en">25+ years in accounting, now building independent products with AI. Motto: <strong>AI makes life easier.</strong></span></p>',
              '<p class="sub"><span class="L-ur">قطر میں سرکاری ملازمت کے دوران IT شعبے سے وابستہ ہیں۔ اکاؤنٹنگ بھی پیشہ ورانہ پس منظر کا ایک اہم حصہ ہے، جبکہ AI کے ساتھ آزاد digital products، web platforms اور mobile apps بنا رہے ہیں۔ ذاتی اصول: <strong>AI زندگی کو آسان بناتا ہے۔</strong></span><span class="L-en">Based in Qatar and working in the government sector in IT. Accounting is also an important part of the professional background, while independent digital products, web platforms and mobile apps are built with AI. Motto: <strong>AI makes life easier.</strong></span></p>'
            ),
            (
              '<span class="badge">🧾 <strong>Accountant · 25+ years</strong></span>\n<span class="badge">🤖 <strong>AI builder</strong></span>\n<span class="badge">🌐 <strong>farooqmusicai</strong></span>',
              '<span class="badge">💻 <strong>Government IT · Qatar</strong></span>\n<span class="badge">🧾 <strong>Accounting background</strong></span>\n<span class="badge">🤖 <strong>AI product builder</strong></span>\n<span class="badge">🌐 <strong>farooqmusicai</strong></span>'
            ),
            (
              '<div class="card"><h3>📖 UrduZaban</h3><p><span class="L-ur">آزاد اردو لغت، ادب، کہاوت، قرینہ، رومن اردو، آواز، corpus اور شجرہ — اور آگے community editing اور multilingual language graph۔</span><span class="L-en">Open dictionary, literature, proverbs, Qarina, Roman Urdu, voice, corpus and etymology — growing toward community editing and a multilingual language graph.</span></p></div>',
              '<div class="card"><h3>📖 UrduZaban — اردو زبان</h3><p><span class="L-ur">آزاد اردو لغت، ادب، کہاوت، قرینہ، رومن اردو، آواز، corpus اور شجرہ — اور آگے community editing اور multilingual language graph۔</span><span class="L-en">Open dictionary, literature, proverbs, Qarina, Roman Urdu, voice, corpus and etymology — growing toward community editing and a multilingual language graph.</span></p></div>\n<div class="card"><h3>☁️ Farooq Drive</h3><p><span class="L-ur">زیرِ تعمیر digital project جس پر AI-assisted development کے ساتھ کام جاری ہے؛ مقصد اپنے tools اور data workflows کو مزید منظم اور خودمختار بنانا ہے۔</span><span class="L-en">An active digital project being developed with AI assistance, focused on more independent tools and data workflows.</span></p></div>\n<div class="card"><h3>📱 Mobile Apps</h3><p><span class="L-ur">Farooq Music سمیت mobile apps پر مسلسل کام — web projects کو Android اور iOS تک لے جانے کی سمت۔</span><span class="L-en">Ongoing mobile-app work, including Farooq Music, extending web products to Android and iOS.</span></p></div>'
            ),
            (
              '<div class="card"><h3>🧾 Gulf accounting</h3><p><span class="L-ur">WPS، gratuity اور Gulf business accounting کا 25+ سالہ تجربہ۔ QuickBooks 1997 سے استعمال کیا — اور اب اپنا accounting package بنانے کی سمت۔</span><span class="L-en">25+ years of Gulf accounting experience; a QuickBooks user since 1997, now moving toward building an independent accounting package.</span></p></div>',
              '<div class="card"><h3>💼 پیشہ ورانہ پس منظر</h3><p><span class="L-ur">قطر میں سرکاری IT شعبے سے وابستگی کے ساتھ اکاؤنٹنگ، Gulf business processes، WPS اور gratuity کا طویل تجربہ بھی موجود ہے۔ QuickBooks 1997 سے استعمال کیا، اور اب اپنے tools اور systems بنانے کی سمت کام جاری ہے۔</span><span class="L-en">Professional experience combines government-sector IT in Qatar with a long background in accounting and Gulf business processes, including WPS and gratuity. A QuickBooks user since 1997, now increasingly building independent tools and systems.</span></p></div>'
            )
          ]

          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Expected About text not found; refusing partial update: '+old[:70])
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Privacy and content checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('about.html').read_text(encoding='utf-8')
          required=[
            'Government IT · Qatar','Accounting background','Farooq Drive','Mobile Apps',
            'linkedin.com/in/mohammad-farooq-b4834b44','سرکاری IT شعبے'
          ]
          for x in required:
              assert x in s, x
          forbidden=['Qatar Armed Forces','Qatar Armed Force','military unit','فوجی یونٹ']
          for x in forbidden:
              assert x not in s, x
          assert s.count('uz-ui.css')==1
          assert s.count('uz-preferences.js')==1
          assert '<html' in s and '</html>' in s and '<body' in s and '</body>' in s
          print('About profile update checks: OK')
          PY

      - name: Commit updated About page
        run: |
          git config user.name "urduzaban-bot"
          git config user.email "urduzaban-bot@users.noreply.github.com"
          git add about.html
          git diff --cached --quiet && { echo "No About changes"; exit 0; }
          git commit -m "site: refine founder profile and current projects"
          git push origin HEAD:feature/about-profile-update-2026-09-06
