<!doctype html>
<html lang="ur" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>قرینہ — نیورل آواز</title>
<style>
  @font-face{font-family:'Noto Nastaliq Urdu';src:url('fonts/noto-nastaliq-urdu-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Noto Naskh Arabic';src:url('fonts/noto-naskh-arabic-400.woff2') format('woff2');font-weight:400;font-display:swap}
  :root{--bg:#fbfaf7;--fg:#1b1b1a;--mut:#6b6a66;--line:#e2ded4;--card:#fff;--ok:#1f7a4d;--warn:#8a6116;--err:#a3242b;--acc:#0f5c4a;--hl:#e8f2ee}
  @media(prefers-color-scheme:dark){:root{--bg:#14150f;--fg:#eceadf;--mut:#9a988e;--line:#2e3026;--card:#1c1e17;--ok:#63c08d;--warn:#d6a94a;--err:#e0787d;--acc:#63c0a8;--hl:#1f2d28}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Naskh Arabic',system-ui,sans-serif;line-height:1.9}
  .wrap{max-width:780px;margin:0 auto;padding:22px 16px 60px}
  h1{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;font-size:1.8rem;line-height:2.4;margin:.2em 0 .1em}
  .sub{color:var(--mut);font-size:.9rem;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  textarea{width:100%;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);
           font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;font-size:1.3rem;line-height:2.7;resize:vertical}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
  button{font-family:inherit;font-size:1rem;padding:10px 20px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--acc)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .ex{background:transparent;border:1px solid var(--line);color:var(--fg);font-family:'Noto Nastaliq Urdu',serif;font-size:1rem;padding:6px 13px;line-height:2.2}
  .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .tlbl{font-size:.82rem;color:var(--mut)}
  .tsep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .tb{background:transparent;border:1px solid var(--line);color:var(--fg);font-size:.85rem;padding:5px 11px;border-radius:8px}
  .tb:hover{border-color:var(--acc);color:var(--acc)}
  .badge{font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-inline-start:6px;color:var(--mut);font-family:system-ui}
  li.pause{color:var(--mut);font-style:normal;font-family:system-ui;font-size:.9rem}
  .sld{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.9rem;color:var(--mut);flex-wrap:wrap}
  .sld input[type=range]{flex:1;min-width:150px;accent-color:var(--acc)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px;display:none}
  .bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
  .msg{margin-top:10px;font-size:.9rem;color:var(--mut);min-height:1.6em}
  .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)} .msg.err{color:var(--err)}
  ol.lines{margin:12px 0 0;padding:0 22px 0 0;font-family:'Noto Nastaliq Urdu',serif;font-size:1.05rem;line-height:2.4}
  ol.lines li{color:var(--mut);padding:2px 6px;border-radius:6px}
  ol.lines li.done{color:var(--fg)}
  ol.lines li.now{color:var(--fg);background:var(--hl)}
  dl{margin:0;font-size:.86rem;color:var(--mut)} dt{float:right;clear:right;margin-left:8px;opacity:.75} dd{margin:0 0 2px}
</style>
<script src="qarina-tts/lib/lame.min.js"></script>
<div class="wrap">
  <h1>قرینہ — نیورل آواز</h1>
  <div class="sub">ماڈل آپ کے براؤزر میں چلتا ہے · کوئی سرور نہیں</div>

  <div class="card">
    <div class="tools">
      <span class="tlbl">منتخب کر کے:</span>
      <button class="tb" data-tag="بہت سست">بہت سست</button>
      <button class="tb" data-tag="سست">سست</button>
      <button class="tb" data-tag="تیز">تیز</button>
      <button class="tb" data-tag="بہت تیز">بہت تیز</button>
      <span class="tsep"></span>
      <button class="tb" data-tag="بلند">بلند</button>
      <button class="tb" data-tag="دھیما">دھیما</button>
      <span class="tsep"></span>
      <button class="tb" data-rep="2">دہرا ×2</button>
      <button class="tb" data-rep="3">دہرا ×3</button>
      <span class="tsep"></span>
      <span class="tlbl">وقفہ:</span>
      <button class="tb" data-pause="0.5">½ سیکنڈ</button>
      <button class="tb" data-pause="1">1 سیکنڈ</button>
      <button class="tb" data-pause="2">2 سیکنڈ</button>
      <button class="tb" data-pause="3">3 سیکنڈ</button>
      <span class="tsep"></span>
      <button class="tb" id="clr">نشان ہٹائیں</button>
    </div>
    <textarea id="txt" spellcheck="false">مُنتشِر ہوتا تو ہے لیکِن سَاں وَر جاتا ہے کون
ریزہ ریزہ ہو کے بھی یکسر نِکھَر جاتا ہے کون</textarea>
    <div class="row" id="examples"></div>

    <div class="sld">
      <span>رفتار</span>
      <input type="range" id="speed" min="0.65" max="1.6" step="0.05" value="1">
      <span id="speedv" style="min-width:3.4em">عام</span>
    </div>

    <div class="row">
      <button id="go">بولیں</button>
      <button id="pause" class="ghost" disabled>وقفہ</button>
      <button id="stop" class="ghost" disabled>روکیں</button>
    </div>
    <div class="row">
      <button id="wav" class="ghost" disabled>WAV</button>
      <button id="mp3" class="ghost" disabled>MP3</button>
    </div>

    <div class="bar" id="bar"><i></i></div>
    <div class="msg" id="msg">تیار</div>
    <ol class="lines" id="lines"></ol>
  </div>

  <div class="card"><dl><dt>حالت</dt><dd id="state">ماڈل ابھی لوڈ نہیں ہوا</dd></dl></div>
</div>

<script type="module">
const BASE='qarina-tts/neural/', CACHE='qarina-neural-v1';
const $=s=>document.querySelector(s);
const msg=(t,k='')=>{const m=$('#msg');m.textContent=t;m.className='msg '+k;};
const bar=r=>{const b=$('#bar');b.style.display=r==null?'none':'block';if(r!=null)b.firstElementChild.style.width=(r*100).toFixed(1)+'%';};

// Saara bhaari kaam alag worker mein hota hai -> safha kabhi nahi jamta.
let worker=null, rpcId=0; const pending=new Map();
function wk(){
  if(worker) return worker;
  worker=new Worker('qarina-tts/neural-worker.mjs',{type:'module'});
  worker.onmessage=e=>{const m=e.data,p=pending.get(m.id);if(!p)return;pending.delete(m.id);
    m.t==='err'?p.rej(new Error(m.msg)):p.res(m);};
  worker.onerror=e=>{for(const p of pending.values())p.rej(new Error('worker: '+(e.message||'error')));pending.clear();};
  return worker;
}
const call=(m,tr=[])=>new Promise((res,rej)=>{const id=++rpcId;pending.set(id,{res,rej});wk().postMessage({...m,id},tr);});

let loaded=false,cfg=null,vocab=null,sr=16000;
let ctx=null,sources=[],playHead=0,abort=false,busy=false,allPcm=[];

const j=async p=>{const r=await fetch(BASE+p,{cache:'no-cache'});if(!r.ok)throw new Error(p+' — HTTP '+r.status);return r.json();};

/* ---------- nishan (tags) ----------
   [سست: متن]      [تیز: متن]      [بہت سست: متن]   [بہت تیز: متن]
   [بلند: متن]     [دھیما: متن]
   [دہرا 3: متن]   -> teen baar
   [وقف 2]         -> 2 second khamoshi
   Nishan aik doosre ke andar bhi chal jaate hain: [سست: [بلند: متن]]
   Kuch bhi na lagayein -> saada, musalsal.                                  */
const SPEED={'بہت سست':1.35,'سست':1.18,'عام':1,'تیز':0.85,'بہت تیز':0.72};
const GAIN ={'بلند':1,'دھیما':0.45};
const DEF_GAIN=0.78;

function closeBracket(t,i){                 // nested [] ka sahih jora dhoondo
  let d=0;
  for(let k=i;k<t.length;k++){ if(t[k]==='[')d++; else if(t[k]===']'){d--; if(!d)return k;} }
  return -1;
}
function splitLines(t){                     // misra / jumla ba jumla; nl = nayi satar
  const out=[];
  for(const line of t.split(/\n+/)){
    let first=true;
    for(let s of line.split(/(?<=[۔؟!])\s*/)){
      s=s.trim(); if(!s) continue;
      while(s.length>110){
        let c=s.lastIndexOf('،',110); if(c<40)c=s.lastIndexOf(' ',110); if(c<40)c=110;
        out.push({t:s.slice(0,c).trim(),nl:first}); first=false; s=s.slice(c).trim();
      }
      if(s){ out.push({t:s,nl:first}); first=false; }
    }
  }
  return out;
}

// Model har tukde ke aage-peeche ~0.3 sec khamoshi chhorta hai. Do tukde jorne par
// woh 0.6-0.8 sec ka jhol ban jaata hai - isi liye awaz "tooti hui" lagti thi.
// Yahan use kaat kar apni napi hui, chhoti si saans di jaati hai.
function trim(p,thr=0.012){
  let a=0,b=p.length-1;
  while(a<b&&Math.abs(p[a])<thr)a++;
  while(b>a&&Math.abs(p[b])<thr)b--;
  a=Math.max(0,a-320); b=Math.min(p.length-1,b+800);   // 20ms pehle, 50ms baad
  return p.subarray(a,b+1);
}
function walk(text,st,out){
  let i=0,buf='';
  const flush=()=>{ for(const c of splitLines(buf)) out.push({text:c.t,nl:c.nl,ls:st.ls,gain:st.gain,label:st.label}); buf=''; };
  while(i<text.length){
    if(text[i]==='['){
      const e=closeBracket(text,i);
      if(e<0){ buf+=text[i++]; continue; }
      flush();
      const inner=text.slice(i+1,e); i=e+1;
      const pm=inner.match(/^\s*وقف\s*([\d.]+)?\s*$/);
      if(pm){ out.push({pause:Math.min(10,Math.max(0.1,parseFloat(pm[1]||'1')))}); continue; }
      const rm=inner.match(/^\s*دہرا\s*(\d+)\s*:\s*([\s\S]*)$/);
      if(rm){ const n=Math.min(9,Math.max(2,+rm[1])); const tmp=[]; walk(rm[2],st,tmp);
              for(let k=0;k<n;k++){ tmp.forEach(x=>out.push({...x,label:(x.label?x.label+' ':'')+'دہرا '+(k+1)+'/'+n}));
                                    if(k<n-1) out.push({pause:0.35}); }
              continue; }
      const sm=inner.match(/^\s*(بہت سست|سست|بہت تیز|تیز|عام|بلند|دھیما)\s*:\s*([\s\S]*)$/);
      if(sm){ const name=sm[1];
              const st2={ls:st.ls*(SPEED[name]??1), gain:st.gain*((GAIN[name]??DEF_GAIN)/DEF_GAIN),
                          label:(st.label?st.label+' + ':'')+name};
              walk(sm[2],st2,out); continue; }
      buf+=inner;                              // pehchana nahi -> saada matn
    } else buf+=text[i++];
  }
  flush();
}
const parse=(t,baseLs)=>{const o=[];walk(t,{ls:baseLs,gain:DEF_GAIN,label:''},o);return o;};

function ids(t){
  const kept=[],drop=[];
  for(const c of t.toLowerCase())(c in vocab?kept:drop).push(c);
  let a=kept.map(c=>vocab[c]);
  if(cfg.add_blank){const o=new Array(2*a.length+1).fill(0);for(let i=0;i<a.length;i++)o[2*i+1]=a[i];a=o;}
  return {a,drop:[...new Set(drop)].filter(c=>c.trim())};
}

async function getModel(){
  const info=await j('info.json').catch(()=>({}));
  const url=BASE+'model.onnx', key=url+'#'+(info.sha256||'x');
  const cache=await caches.open(CACHE).catch(()=>null);
  if(cache){const hit=await cache.match(key);if(hit){msg('ماڈل cache سے…');return hit.arrayBuffer();}}
  const res=await fetch(url);
  if(!res.ok)throw new Error('model.onnx — HTTP '+res.status+' (workflow چلایا؟)');
  const total=Number(res.headers.get('content-length'))||info.bytes||0;
  const parts=[];let got=0;const rd=res.body.getReader();bar(0);
  for(;;){const{done,value}=await rd.read();if(done)break;
    parts.push(value);got+=value.byteLength;
    if(total)bar(got/total);
    msg(`ماڈل آ رہا ہے… ${(got/1048576).toFixed(1)}${total?' / '+(total/1048576).toFixed(1):''} MB`);}
  bar(null);
  const buf=await new Blob(parts).arrayBuffer();
  if(cache){for(const k of await cache.keys())if(k.url.startsWith(url)&&k.url!==key)await cache.delete(k);
            await cache.put(key,new Response(buf)).catch(()=>{});}
  return buf;
}

async function ready(){
  if(loaded)return;
  [cfg,vocab]=await Promise.all([j('config.json'),j('vocab.json')]);
  sr=cfg.sampling_rate;
  const buf=await getModel();
  const mb=(buf.byteLength/1048576).toFixed(1);
  msg('ماڈل کھل رہا ہے…');
  await call({t:'init',buf},[buf]);
  loaded=true;
  $('#state').innerHTML=`ماڈل: <b>${mb} MB</b> · الگ worker میں چل رہا ہے ✅ (صفحہ کبھی نہیں جمے گا)`;
}

async function say(text,ls){
  const {a,drop}=ids(text);
  if(a.length<3)return{pcm:new Float32Array(0),drop};
  const r=await call({t:'say',ids:a,ns:cfg.noise_scale,ls,nsw:cfg.noise_scale_w});
  return {pcm:r.pcm,drop};
}

// Pehle poori awaz ban jaati hai, phir EK hi buffer mein bajti hai.
// Tukda-ba-tukda bajane par, agar banne ki raftaar bajne se sust ho (rtf > 1),
// to har satar ke baad jhol par jaata tha. Ab aisa mumkin hi nahi.
function playAll(pcm){
  const b=ctx.createBuffer(1,pcm.length,sr);
  b.getChannelData(0).set(pcm);
  const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);
  s.start(ctx.currentTime+0.05);sources.push(s);
}

function stopAll(){
  abort=true;
  for(const s of sources){try{s.stop()}catch{}}
  sources=[];playHead=0;
  if(ctx&&ctx.state==='suspended')ctx.resume();
  $('#pause').disabled=true;$('#stop').disabled=true;$('#pause').textContent='وقفہ';
}

/* ---------- toolbar: muntakhab matn par nishan ---------- */
function wrap(tag){
  const ta=$('#txt'), a=ta.selectionStart, z=ta.selectionEnd;
  if(a===z){msg('پہلے متن کا کوئی حصہ منتخب کریں۔','warn');ta.focus();return;}
  ta.setRangeText('['+tag+': '+ta.value.slice(a,z)+']',a,z,'select');
  ta.focus(); msg('لگ گیا — "بولیں" دبائیں۔');
}
document.querySelectorAll('.tb[data-tag]').forEach(b=>b.onclick=()=>wrap(b.dataset.tag));
document.querySelectorAll('.tb[data-rep]').forEach(b=>b.onclick=()=>wrap('دہرا '+b.dataset.rep));
document.querySelectorAll('.tb[data-pause]').forEach(b=>b.onclick=()=>{
  const ta=$('#txt'),p=ta.selectionEnd;
  ta.setRangeText(' [وقف '+b.dataset.pause+'] ',p,p,'end');
  ta.focus(); msg('وقفہ لگ گیا۔');
});
$('#clr').onclick=()=>{
  const ta=$('#txt'); let v=ta.value, prev;
  // [^\S\n] = space/tab magar nayi satar NAHI - warna sher ki satrein tootti hain
  do{ prev=v;
      v=v.replace(/[^\S\n]*\[\s*وقف[^\]]*\][^\S\n]*/g,' ')
         .replace(/\[\s*(?:بہت سست|سست|بہت تیز|تیز|عام|بلند|دھیما|دہرا\s*\d+)\s*:\s*([^\[\]]*)\]/g,'$1');
  }while(v!==prev);
  ta.value=v.replace(/[^\S\n]{2,}/g,' ');
  msg('نشان ہٹا دیے۔');
};

$('#speed').addEventListener('input',e=>{
  const v=+e.target.value;
  $('#speedv').textContent=v<0.85?'تیز':v>1.2?'سست':'عام';
});

$('#go').addEventListener('click',async()=>{
  if(busy)return; busy=true; abort=false; allPcm=[];
  $('#go').disabled=true;$('#wav').disabled=true;$('#mp3').disabled=true;
  try{
    await ready();
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')await ctx.resume();
    playHead=ctx.currentTime;

    const base=2.25-(+$('#speed').value);
    const segs=parse($('#txt').value, base);
    if(!segs.length){msg('پہلے کچھ لکھیں۔','warn');return;}

    const ol=$('#lines');ol.innerHTML='';
    const lis=segs.map(sg=>{
      const li=document.createElement('li');
      if(sg.pause){ li.className='pause'; li.textContent='⏸ '+sg.pause+' سیکنڈ'; }
      else{ li.textContent=sg.text;
            if(sg.label){const b=document.createElement('span');b.className='badge';b.textContent=sg.label;li.appendChild(b);} }
      ol.appendChild(li);return li;});

    $('#stop').disabled=false;$('#pause').disabled=false;
    const drops=new Set(); const t0=performance.now(); let secs=0, justPaused=false;

    for(let i=0;i<segs.length&&!abort;i++){
      const sg=segs[i];
      if(sg.pause){                                  // khamoshi: awaz mein bhi, file mein bhi
        allPcm.push(new Float32Array(Math.round(sg.pause*sr))); secs+=sg.pause;
        justPaused=true; lis[i].classList.add('done'); continue;
      }
      lis[i].classList.add('now');
      bar((i+1)/segs.length);
      msg(`آواز بن رہی ہے… ${i+1} / ${segs.length}`);
      const {pcm,drop}=await say(sg.text,sg.ls);
      if(abort)break;
      drop.forEach(d=>drops.add(d));
      if(pcm.length){
        const cut=trim(pcm);
        // apni napi hui saans: nayi satar par thori lambi, jumle ke andar chhoti.
        // Magar agar user ne khud [وقف] lagaya hai to uske baad kuch mat joro -
        // 2 second ka matlab theek 2 second hona chahiye.
        if(allPcm.length && !justPaused){ const gp=Math.round((sg.nl?0.18:0.06)*sr);
                           allPcm.push(new Float32Array(gp)); secs+=gp/sr; }
        justPaused=false;
        const g=sg.gain??DEF_GAIN;
        const out=new Float32Array(cut.length);
        for(let k=0;k<cut.length;k++) out[k]=cut[k]*g;
        allPcm.push(out); secs+=cut.length/sr;
      }
      lis[i].classList.remove('now');lis[i].classList.add('done');
    }
    bar(null);
    allPcm.push(new Float32Array(Math.round(0.2*sr)));   // aakhri lafz ko saans lene ki jagah
    if(abort){msg('روک دیا گیا۔','warn');return;}
    const wall=(performance.now()-t0)/1000;
    playAll(merge());                                   // poori awaz, ek saath, bina jhol ke
    $('#wav').disabled=false;$('#mp3').disabled=false;
    msg(`چل رہی ہے — ${secs.toFixed(1)} سیکنڈ آواز، ${wall.toFixed(1)} سیکنڈ میں بنی (rtf ${(wall/secs).toFixed(2)})`
        +(drops.size?` · لغت سے باہر: ${[...drops].join(' ')}`:''),'ok');
  }catch(e){msg('خرابی: '+e.message,'err');console.error(e);bar(null);}
  finally{busy=false;$('#go').disabled=false;$('#stop').disabled=true;}
});

$('#pause').addEventListener('click',async()=>{
  if(!ctx)return;
  if(ctx.state==='running'){await ctx.suspend();$('#pause').textContent='جاری';}
  else{await ctx.resume();$('#pause').textContent='وقفہ';}
});
$('#stop').addEventListener('click',stopAll);

function merge(){const n=allPcm.reduce((a,b)=>a+b.length,0);const o=new Float32Array(n);let k=0;for(const p of allPcm){o.set(p,k);k+=p.length;}return o;}
function norm(f){let pk=0;for(const x of f)pk=Math.max(pk,Math.abs(x));const g=0.95/Math.max(1e-9,pk);
  const o=new Int16Array(f.length);for(let i=0;i<f.length;i++)o[i]=Math.max(-32768,Math.min(32767,f[i]*g*32767));return o;}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

$('#wav').addEventListener('click',()=>{
  const pcm=norm(merge()),n=pcm.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  s(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,pcm[i],true);
  save(new Blob([b],{type:'audio/wav'}),'qarina.wav');
});

$('#mp3').addEventListener('click',()=>{
  if(!window.lamejs){msg('MP3 encoder لوڈ نہیں ہوا۔','err');return;}
  const pcm=norm(merge());
  const enc=new lamejs.Mp3Encoder(1,sr,128),parts=[];
  for(let i=0;i<pcm.length;i+=1152){const b=enc.encodeBuffer(pcm.subarray(i,i+1152));if(b.length)parts.push(new Uint8Array(b));}
  const f=enc.flush();if(f.length)parts.push(new Uint8Array(f));
  save(new Blob(parts,{type:'audio/mpeg'}),'qarina.mp3');
});

  const b=document.createElement('button');b.className='ex';b.textContent=t;
  b.onclick=()=>{$('#txt').value=t;};$('#examples').appendChild(b);
}
